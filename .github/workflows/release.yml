name: Release new version

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false   # use GITHUB_TOKEN
        fetch-depth: 1               # fetch depth is nr of commits

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen
        pip install pandas

    - name: dump stuff
      run: |
        mkdir dumps
        python -c 'from pyriksdagen.reference_handling import compile_bib_list; compile_bib_list(output_file="dumps/reference-list.bib")'

    - name: zip dumps
      run: zip dumps.zip dumps

    - name: Zip corpus
      run: |
        zip -r motions.zip data

    - name: zip quality estimates
      run: zip -r quality.zip quality/estimates

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./*.zip
        tag: ${{ github.ref }}
        file_glob: true

    - name: Clone scripts repo
      run: |
        git clone -b export https://github.com/swerik-project/scripts.git

    - name: Convert data to NDJSON and sqlite
      run: |
        python3 scripts/src/export_motions.py -L data

    - name: Upload sqlite to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./*.sqlite
        tag: ${{ github.ref }}
        file_glob: true

    - name: Upload ndjson to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./*.ndjson
        tag: ${{ github.ref }}
        file_glob: true
