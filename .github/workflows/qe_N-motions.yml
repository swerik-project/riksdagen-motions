name: "Riksdagen Motions: Quality Estimation"

on:
  pull_request:
    branches:
      - 'dev'

concurrency:
  group: motions-autocommit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  signature-matching-estimator:
    name: Signature-matching estimator checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install estimator dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen polars scipy packaging
    - name: Check estimator using temporary fixtures
      run: python -m unittest quality.test_signature_matching

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
    - name: Checkout PR source branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen

    - name: Count number of Motions
      run: |
        python quality/qe_N-motions.py

    - name: Add and commit changes
      if: ${{ env.ACT != 'true' }}
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        if [[ `git status quality/estimates/N-motions/ --porcelain --untracked-files=no` ]]; then
          git add quality/estimates/N-motions/
          git commit -m "chore (workflow): update Motion Counts"
        else
          echo ""
          echo "::warning:: WARNING!!! No changes detected in quality/estimates/N-motions/."
          echo "           Double check the version nr and everything else is up to date."
          echo ""
          git commit --allow-empty -m "chore (workflow): no changes to motion counts"
        fi

    - name: Rebase on branch tip
      if: ${{ env.ACT != 'true' }}
      run: git pull --rebase origin "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

    - name: Push changes
      if: ${{ env.ACT != 'true' }}
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.head_ref }}
