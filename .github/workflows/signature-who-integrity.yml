name: "Riksdagen Motions: Signature Who Integrity"

on:
  pull_request:
    paths:
      - data/**
      - test/**
      - .github/workflows/signature-who-integrity.yml

jobs:
  signature-who-integrity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
    steps:
    - uses: actions/checkout@v4
      with:
        path: riksdagen-motions
    - uses: actions/checkout@v4
      with:
        repository: swerik-project/riksdagen-persons
        ref: main
        path: riksdagen-persons
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      working-directory: riksdagen-motions
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen
        pip install pytest-cfg-fetcher
    - name: Test signature who integrity
      working-directory: riksdagen-motions
      env:
        PERSONS_ROOT: ${{ github.workspace }}/riksdagen-persons
      run: python -m unittest test.signature-who-integrity
